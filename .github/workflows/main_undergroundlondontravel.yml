# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - UndergroundLondonTravel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: undergroundlondontravel-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for azure/login OIDC
      contents: read    # required for actions/checkout

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/undergroundlondontravel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: index.docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists in registry
        run: |
          docker buildx imagetools inspect $IMAGE_NAME:sha-${GITHUB_SHA}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E36857FC84BE4E16B067296EE187372A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A80193C8A01245C89997705BBF5DF92F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94EE2AD9BD704075A2CDD202FD760F1A }}

      - name: Deploy container to Azure App Service
        uses: Azure/webapps-deploy@v2
        with:
          app-name: UndergroundLondonTravel
          slot-name: Production
          images: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
